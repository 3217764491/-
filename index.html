<!-- ★★★ 本地存储桥接：必须在所有脚本最前面 ★★★ -->
<script>
(function(){
  if (typeof LuaStorage === 'undefined') { window.__LS_MODE = 'browser'; return; }

  window.__LS_MODE = 'lua';
  var mem = {};
  var LS = {
    getItem:    function(k){
      try { var v = LuaStorage.getItem(String(k)); return (v === '' || v == null) ? null : v; }
      catch(e){ return mem[k] || null; }
    },
    setItem:    function(k,v){
      try { LuaStorage.setItem(String(k), String(v)); }
      catch(e){ mem[k] = String(v); }
    },
    removeItem: function(k){
      try { LuaStorage.removeItem(String(k)); }
      catch(e){ delete mem[k]; }
    },
    clear:      function(){ mem = {}; },
    key:        function(){ return null; },
    length:     0
  };
  try { Object.defineProperty(window, 'localStorage', { value: LS, configurable: false }); }
  catch(e){ window.localStorage = LS; }
})();
</script>

<script src="https://unpkg.com/mqtt@4.1.0/dist/mqtt.min.js"></script>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --primary:#0b93f6;
    --text:#17181a; --muted:#8b9098; --border:#e3e6ea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ★ 顶部面板：固定两行布局，绝不挤压消息区 */
  .join-panel{
    flex:0 0 auto;
    flex-shrink: 0; /* 绝对禁止被上下压缩 */
    display:flex;
    flex-direction:column; /* 纵向排列两行 */
    gap:6px;
    padding:8px 10px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    width: 100%;
  }

  .join-row {
    display: flex;
    flex-wrap: nowrap; /* 行内强制不折行 */
    align-items: center;
    gap: 6px;
    width: 100%;
  }

  /* 输入框自适应变窄，平分空间 */
  .join-row input{
    flex: 1 1 0%;
    min-width: 0; /* 核心：允许缩小到极小 */
    width: 0;
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    line-height: 1.2;
    outline: none;
    background: #fff;
  }
  .join-row input:focus{border-color:var(--primary)}

  .my-id{
    flex:0 0 auto;
    font-size:12px;font-weight:700;
    color:var(--primary);background:#e8f3ff;
    padding:5px 8px;border-radius:6px;
    user-select:all;
  }

  .status{font-size:12px;color:var(--muted);flex:0 0 auto;}
  .status.online{color:#22c55e}
  
  .presence{
    flex:0 0 auto;
    font-size:12px;font-weight:500;
    color:var(--primary);background:#e8f3ff;
    padding:5px 8px;border-radius:6px;
    white-space:nowrap;
  }
  .presence.offline{color:var(--muted);background:#f0f2f5}

  .clear-btn{
    flex:0 0 auto;
    margin-left: auto; /* ★ 自动靠右排列 */
    padding:5px 10px;
    border:1px solid var(--border);
    border-radius:6px;
    background:#f7f8fa;
    color:var(--muted);
    font:inherit;font-size:12px;
    cursor:pointer;
  }
  .clear-btn:active{background:#ffe9e9;color:#d64545}

  /* 消息区域 */
  .messages-wrap{
    flex:1 1 0%;
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;
    min-height:0;
  }
  .messages{
    flex:1 1 0%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:12px;padding-right:56px;
    display:flex;flex-direction:column;gap:12px;
    min-height:0;
  }
  .msg{display:flex;gap:6px;align-items:flex-start;animation:fadeIn .22s ease}
  .msg.me{flex-direction:row-reverse}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .avatar{
    flex:0 0 30px;width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;font-size:14px;background:#dfe3e8;user-select:none;
  }
  .msg.me .avatar{background:#cfe6ff}
  .bubble{
    max-width:78%;padding:8px 12px;border-radius:12px;
    background:var(--panel);line-height:1.5;font-size:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.06);word-break:break-word;overflow-wrap:anywhere;
    border-top-left-radius:4px;
  }
  .msg.me .bubble{background:var(--primary);color:#fff;border-top-left-radius:12px;border-top-right-radius:4px}
  .sender{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:500}
  .msg.me .sender{color:#d0e8ff;text-align:right}
  .bubble .text{white-space:pre-wrap}

  .msg-system{display:flex;justify-content:center;margin:4px 0}
  .msg-system span{
    background:#dcdfe3;color:#555;font-size:11px;
    padding:3px 10px;border-radius:10px;
  }

  .imgs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .img-wrap{
    position:relative;border-radius:8px;overflow:hidden;cursor:pointer;
    line-height:0;background:#f0f2f5;box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .img-wrap img{width:110px;height:110px;object-fit:cover;display:block}

  .nav-stack{
    position:absolute;right:10px;bottom:20px;z-index:50;
    display:flex;flex-direction:column;gap:8px;pointer-events:none;
  }
  .nav-btn{
    pointer-events:auto;width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.92);color:#0b93f6;
    font-size:14px;display:grid;place-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    user-select:none;cursor:pointer;
    border:1px solid rgba(0,0,0,.05);
    transition:transform .12s, background .15s;
  }
  .nav-btn:active{background:#0b93f6;color:#fff;transform:scale(.92);}

  .composer{
    flex:0 0 auto;background:var(--panel);border-top:1px solid var(--border);
    padding:8px 10px;
  }
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .thumbs:empty{display:none}
  .thumb{position:relative;width:48px;height:48px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{
    position:absolute;top:2px;right:2px;width:16px;height:16px;padding:0;
    border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
    font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center;
  }

  .input-row{display:flex;align-items:flex-end;gap:6px;}

  .icon-btn{
    flex:0 0 36px;width:36px;height:36px;border-radius:10px;
    background:#f0f2f5;font-size:18px;cursor:pointer;display:grid;place-items:center;user-select:none;
  }

  textarea{
    flex:1 1 0%; width:0; min-width:0;
    resize:none; border:1px solid var(--border); border-radius:10px;
    padding:8px 10px; font:inherit; font-size:14px; line-height:1.4;
    height:36px; min-height:36px; max-height:80px; outline:none;
    background:#fafbfc; color:inherit; overflow-y:hidden; word-break:break-all;
  }
  textarea:focus{border-color:var(--primary);background:#fff}

  .send-btn{
    flex:0 0 auto;height:36px;padding:0 14px;border:0;border-radius:10px;
    background:var(--primary);color:#fff;font:inherit;font-size:14px;font-weight:500;
    cursor:pointer;
  }
  #toast{
    position:fixed;left:50%;bottom:80px;transform:translate(-50%,10px);z-index:999;
    background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:7px 12px;
    border-radius:8px;max-width:80vw;text-align:center;
    opacity:0;pointer-events:none;transition:.25s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  .confirm-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:20px;
    animation:maskIn .15s ease;
  }
  @keyframes maskIn{from{opacity:0}to{opacity:1}}
  .confirm-box{
    background:#fff;border-radius:12px;padding:18px;max-width:280px;width:100%;
    box-shadow:0 8px 24px rgba(0,0,0,.2);text-align:center;
    font-size:14px;color:#17181a;line-height:1.5;
    animation:boxIn .18s ease;
  }
  @keyframes boxIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  .confirm-box .confirm-text{margin-bottom:14px;word-break:break-word}
  .confirm-box .confirm-actions{display:flex;gap:8px}
  .confirm-box button{
    flex:1;height:36px;border:0;border-radius:8px;
    font-size:14px;cursor:pointer;font-family:inherit;
  }
  .confirm-box .btn-yes{background:var(--primary);color:#fff}
  .confirm-box .btn-no{background:#eef1f5;color:#17181a}
</style>
</head>
<body>

  <!-- ★ 顶部两行结构，整洁不拥挤 -->
  <div class="join-panel">
    <!-- 第一行：昵称、ID、房间号 -->
    <div class="join-row">
      <input type="text" id="nickname" placeholder="昵称" value="用户">

<script>
/* ============ 配置 ============ */
const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
const MAX_HISTORY = 300;
const SYNC_HISTORY = true;
const MAX_IMG_SIDE = 1024;
const JPEG_QUALITY = 0.75;

const PRESENCE_TOPIC = 'chat/global/presence';
const HEARTBEAT_MS   = 15000;
const PEER_TIMEOUT   = 45000;
const PRUNE_MS       = 10000;
const MY_CLIENT_ID   = 'web_' + Math.random().toString(16).slice(2,10)
                             + Date.now().toString(36).slice(-4);

/* ============ 用户随机ID ============ */
function getOrCreateShortId(){
  try{
    var id = localStorage.getItem('my_short_id');
    if(id && /^[A-Z0-9]{4}$/.test(id)) return id;
    id = (Math.random().toString(36).slice(2,6) + '0000').slice(0,4).toUpperCase();
    localStorage.setItem('my_short_id', id);
    return id;
  }catch(e){
    return (Math.random().toString(36).slice(2,6) + '0000').slice(0,4).toUpperCase();
  }
}
const SHORT_ID = getOrCreateShortId();

let client = null;
let myNickname = '';
let myDisplayName = '';
let myRoomId = '';
let isConnected = false;
let hasJoined = false;
let pending = [];

const messagesEl  = document.getElementById('messages');
const inputEl     = document.getElementById('input');
const sendBtn     = document.getElementById('sendBtn');
const fileInput   = document.getElementById('fileInput');
const thumbsEl    = document.getElementById('thumbs');
const statusText  = document.getElementById('statusText');
const nicknameIn  = document.getElementById('nickname');
const roomIdIn    = document.getElementById('roomId');
const pickBtn     = document.getElementById('pickBtn');
const clearBtn    = document.getElementById('clearBtn');
const presenceText= document.getElementById('presenceText');
const myIdTag     = document.getElementById('myIdTag');

myIdTag.textContent = '#' + SHORT_ID;

/* ============ 链接屏蔽 ============ */
const LINK_RE = /(?:https?|ftp|file):\/\/[^\s<>"'，。！？、；：（）【】《》「」\u4e00-\u9fa5]+|www\.[^\s<>"'，。！？、；：（）【】《》「」\u4e00-\u9fa5]+|(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:com|cn|net|org|io|co|me|tv|cc|top|xyz|info|biz|app|dev|link|site|online|tech|store|club|vip|pro|live|fun|shop|wang|ren|gov|edu|us|uk|jp|kr|de|fr|ru|hk|tw|sg|au|ca)(?::\d{1,5})?(?:\/[^\s<>"'，。！？、；：（）【】《》「」\u4e00-\u9fa5]*)?/gi;
const LINK_PLACEHOLDER = '【链接已屏蔽】';

function hasLink(text){
  if(!text) return false;
  LINK_RE.lastIndex = 0;
  const r = LINK_RE.test(text);
  LINK_RE.lastIndex = 0;
  return r;
}
function sanitizeLinks(text){
  if(!text) return text;
  return String(text).replace(LINK_RE, LINK_PLACEHOLDER);
}

/* ============ 工具 ============ */
function scrollToBottom(){ requestAnimationFrame(()=>{ messagesEl.scrollTop = messagesEl.scrollHeight; }); }
let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2000);
}
function dataURLtoBlob(dataUrl){
  const parts = dataUrl.split(','); const mime = (parts[0].match(/:(.*?);/)||[,'image/png'])[1];
  const bin = atob(parts[1]); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function guessExt(t){ const m={'image/jpeg':'.jpg','image/jpg':'.jpg','image/png':'.png','image/gif':'.gif','image/webp':'.webp'}; return m[t]||'.png'; }
function makeId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function buildDisplayName(rawNick){
  const base = String(rawNick || '').replace(/#[A-Z0-9]{4}$/,'').trim() || '匿名';
  return base + '#' + SHORT_ID;
}

function showConfirm(text, onYes, onNo){
  const mask = document.createElement('div');
  mask.className = 'confirm-mask';
  const box = document.createElement('div');
  box.className = 'confirm-box';
  box.innerHTML =
    '<div class="confirm-text">' + text + '</div>' +
    '<div class="confirm-actions">' +
      '<button class="btn-no">取消</button>' +
      '<button class="btn-yes">确定</button>' +
    '</div>';
  mask.appendChild(box);
  document.body.appendChild(mask);
  function close(){ if (mask.parentNode) mask.parentNode.removeChild(mask); }
  box.querySelector('.btn-yes').addEventListener('click', ()=>{ close(); onYes && onYes(); });
  box.querySelector('.btn-no').addEventListener('click', ()=>{ close(); onNo && onNo(); });
  mask.addEventListener('click', e=>{ if (e.target === mask) { close(); onNo && onNo(); } });
}

/* ============ 本地持久化 ============ */
const seenIds = new Set();
let history = [];
let saveTimer = null;
function historyKey(){ return 'chat_history_'+myRoomId; }
function loadHistory(){
  history = []; seenIds.clear();
  try{
    const raw = localStorage.getItem(historyKey());
    const arr = raw ? JSON.parse(raw) : [];
    if(Array.isArray(arr)) arr.forEach(m=>{
      if(!m||!m.id||seenIds.has(m.id)) return;
      seenIds.add(m.id); history.push(m);
    });
  }catch(e){ history=[]; }
}
function saveHistory(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    let arr = history.slice(-MAX_HISTORY);
    while(arr.length){
      try{ localStorage.setItem(historyKey(), JSON.stringify(arr)); return; }
      catch(e){ arr = arr.slice(Math.ceil(arr.length/4)); }
    }
    try{ localStorage.removeItem(historyKey()); }catch(e){}
  }, 300);
}
function clearHistory(){
  history=[]; seenIds.clear();
  try{ localStorage.removeItem(historyKey()); }catch(e){}
  messagesEl.innerHTML='';
  addSystemMessage('🗑 本机聊天记录已清空');
}

/* ============ 图片下载 ============ */
async function downloadImage(src, name){
  showToast('正在下载…');
  try{
    let blob;
    if(src.startsWith('data:')) blob = dataURLtoBlob(src);
    else{
      const res = await fetch(src,{mode:'cors'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      blob = await res.blob();
    }
    const filename = name && name.trim() ? name.trim() : ('image_'+Date.now()+guessExt(blob.type));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    showToast('✅ 已开始下载');
  }catch(err){
    try{ window.open(src,'_blank'); }catch(e){}
    showToast('⚠️ 已在新窗口打开');
  }
}

/* ============ 渲染 ============ */
function renderMessage(m){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (m.isMe?'me':'');
  if(m.id) wrap.dataset.id = m.id;

  const avatar = document.createElement('div');
  avatar.className='avatar';
  avatar.textContent = m.sender ? m.sender.charAt(0).toUpperCase() : '?';

  const bubble = document.createElement('div');
  bubble.className='bubble';

  if(m.sender){
    const s = document.createElement('div');
    s.className='sender'; s.textContent = m.sender;
    bubble.appendChild(s);
  }
  if(m.text){
    const t = document.createElement('div');
    t.className='text'; t.textContent = m.text;
    bubble.appendChild(t);
  }
  const images = m.images||[];
  if(images.length){
    const box = document.createElement('div');
    box.className='imgs';
    images.forEach(img=>{
      const src  = typeof img==='string'?img:(img.src||img.url||'');
      const name = (typeof img==='object'&&img.name)?img.name:'';
      if(!src) return;
      if(!/^(data:|blob:)/i.test(src)) return;
      const holder = document.createElement('div');
      holder.className='img-wrap';
      const im = document.createElement('img');
      im.src = src; im.alt='图片'; im.loading='lazy';
      holder.appendChild(im);
      holder.addEventListener('click', ()=>downloadImage(src,name));
      box.appendChild(holder);
    });
    bubble.appendChild(box);
  }

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
}

function addMessage(msg){
  if(!msg) return false;
  if(msg.id && seenIds.has(msg.id)) return false;
  if(msg.id) seenIds.add(msg.id);
  if(typeof msg.text === 'string' && msg.text) msg.text = sanitizeLinks(msg.text);
  history.push(msg);
  if(history.length > MAX_HISTORY*2) history = history.slice(-MAX_HISTORY);
  renderMessage(msg);
  scrollToBottom();
  saveHistory();
  return true;
}
function renderHistory(){
  messagesEl.innerHTML='';
  history.forEach(renderMessage);
  scrollToBottom();
}
function addSystemMessage(text){
  const wrap = document.createElement('div');
  wrap.className='msg-system';
  const span = document.createElement('span');
  span.textContent = text;
  wrap.appendChild(span);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

/* ============ 缩略图 ============ */
function renderThumbs(){
  thumbsEl.innerHTML='';
  pending.forEach((img, idx)=>{
    const d = document.createElement('div'); d.className='thumb';
    const im = document.createElement('img'); im.src = img.src;
    const btn = document.createElement('button');
    btn.type='button'; btn.textContent='×';
    btn.addEventListener('click', e=>{ e.stopPropagation(); e.preventDefault(); pending.splice(idx,1); renderThumbs(); });
    d.appendChild(im); d.appendChild(btn);
    thumbsEl.appendChild(d);
  });
}

/* ============ 图片压缩 ============ */
function compressImage(file){
  return new Promise(resolve=>{
    if(file.type==='image/gif'){
      const r=new FileReader();
      r.onload=()=>resolve({src:r.result, name:file.name});
      r.onerror=()=>resolve(null);
      r.readAsDataURL(file); return;
    }
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.naturalWidth, h=img.naturalHeight;
        const scale = Math.min(1, MAX_IMG_SIDE/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let out; try{ out=cv.toDataURL('image/jpeg',JPEG_QUALITY); }catch(e){ out=r.result; }
        resolve({src:out, name:file.name});
      };
      img.onerror=()=>resolve({src:r.result, name:file.name});
      img.src=r.result;
    };
    r.onerror=()=>resolve(null);
    r.readAsDataURL(file);
  });
}
async function handleFiles(files){
  const list = Array.from(files||[]);
  if(!list.length) return;
  for(const f of list){
    if(!f||!f.type||!f.type.startsWith('image/')) continue;
    if(f.size > 10*1024*1024){ showToast('图片过大（>10MB）'); continue; }
    const out = await compressImage(f);
    if(!out) continue;
    pending.push({src:out.src, name:f.name||('image_'+Date.now()+guessExt(f.type))});
    renderThumbs();
  }
  if(pending.length) showToast('已添加 '+pending.length+' 张图片');
}

/* ============ 在线人数 ============ */
const peers = new Map();
let hbTimer = null, pruneTimer = null, lastHelloReply = 0;

function publishPresence(type){
  if(!client || !isConnected) return;
  try{
    client.publish(PRESENCE_TOPIC, JSON.stringify({
      type: type || 'presence',
      clientId: MY_CLIENT_ID,
      nickname: myDisplayName,
      room: myRoomId,
      timestamp: Date.now()
    }), {qos:0});
  }catch(e){}
}
function startHeartbeat(){
  stopHeartbeat();
  publishPresence('presence');
  try{
    client.publish(PRESENCE_TOPIC, JSON.stringify({
      type:'hello', clientId:MY_CLIENT_ID,
      nickname:myDisplayName, room:myRoomId, timestamp:Date.now()
    }), {qos:0});
  }catch(e){}
  hbTimer    = setInterval(()=>publishPresence('presence'), HEARTBEAT_MS);
  pruneTimer = setInterval(prunePeers, PRUNE_MS);
}
function stopHeartbeat(){
  if(hbTimer){ clearInterval(hbTimer); hbTimer = null; }
  if(pruneTimer){ clearInterval(pruneTimer); pruneTimer = null; }
}
function prunePeers(){
  const now = Date.now(); let changed = false;
  peers.forEach((v,k)=>{
    if(now - (v.ts||0) > PEER_TIMEOUT){ peers.delete(k); changed = true; }
  });
  if(changed) updatePresenceUI();
}
function handlePresence(data){
  if(!data || !data.clientId || data.clientId === MY_CLIENT_ID) return;

  if(data.type === 'offline'){
    if(peers.delete(data.clientId)) updatePresenceUI();
    return;
  }

  peers.set(data.clientId, {
    nickname: data.nickname || '匿名',
    room: data.room || '',
    ts: Date.now()
  });
  updatePresenceUI();

  if(data.type === 'hello' && Date.now() - lastHelloReply > 1500){
    lastHelloReply = Date.now();
    publishPresence('presence');
  }
}
function updatePresenceUI(){
  let roomCount = 0, total = 0;
  peers.forEach((v,k)=>{
    if(k === MY_CLIENT_ID) return;
    total++;
    if(v.room === myRoomId) roomCount++;
  });
  if(isConnected){ total++; roomCount++; }

  // 恢复完整显示文字，第二行空间很充足
  presenceText.textContent = '👥 本' + roomCount + '·全' + total;
  presenceText.classList.toggle('offline', !isConnected);
}

/* ============ MQTT ============ */
function connectToMQTT(){
  if(client){ try{ client.end(true); }catch(e){} client=null; }

  myNickname    = nicknameIn.value.trim() || '匿名';
  myDisplayName = buildDisplayName(myNickname);
  myRoomId      = roomIdIn.value.trim() || 'room1';
  hasJoined  = false;
  isConnected = false;

  peers.clear();
  updatePresenceUI();

  loadHistory();
  renderHistory();

  statusText.textContent = '连接中...';
  statusText.className='status';

  client = mqtt.connect(MQTT_BROKER, {
    clientId: MY_CLIENT_ID,
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000,
    keepalive: 60,
    will: {
      topic: PRESENCE_TOPIC,
      payload: JSON.stringify({ type:'offline', clientId: MY_CLIENT_ID, timestamp: Date.now() }),
      qos: 0,
      retain: false
    }
  });

  const topic     = 'chat/'+myRoomId;
  const topicHist = 'chat/'+myRoomId+'/history';

  client.on('connect', ()=>{
    isConnected = true;
    statusText.textContent='✅ 已连接';
    statusText.className='status online';

    const subList = SYNC_HISTORY ? [topic, topicHist, PRESENCE_TOPIC] : [topic, PRESENCE_TOPIC];
    client.subscribe(subList, err=>{
      if(!err){
        statusText.textContent='✅ 在线';
        if(!hasJoined){
          hasJoined = true;
          client.publish(topic, JSON.stringify({
            type:'join', sender:myDisplayName,
            senderId: MY_CLIENT_ID, timestamp: Date.now()
          }), {qos:0});
        }
        startHeartbeat();
        updatePresenceUI();
        if(SYNC_HISTORY) publishHistory();
      }else{
        statusText.textContent='❌ 订阅失败';
      }
    });
  });

  client.on('message', (recvTopic, payload)=>{
    let data;
    try{ data = JSON.parse(payload.toString()); }
    catch(e){ return; }

    if(recvTopic === PRESENCE_TOPIC){ handlePresence(data); return; }

    if(SYNC_HISTORY && recvTopic === topicHist){
      if(!Array.isArray(data)) return;
      data.forEach(m=>{
        if(!m||!m.id) return;
        addMessage({
          id:m.id, sender:m.sender, text:m.text,
          images:m.images||[], isMe:false, timestamp:m.timestamp
        });
      });
      return;
    }

    if(data.senderId && data.senderId === MY_CLIENT_ID) return;

    if(data.type === 'join'){
      addSystemMessage('👤 '+sanitizeLinks(data.sender||'')+' 加入了房间');
      return;
    }

    addMessage({
      id: data.id || (String(data.senderId)+'_'+data.timestamp),
      sender: data.sender, text: data.text,
      images: data.images||[], isMe:false, timestamp: data.timestamp
    });
  });

  client.on('error', err=>{ statusText.textContent='❌ 错误'; });
  client.on('close', ()=>{
    if(isConnected){
      isConnected = false;
      statusText.textContent='⚠️ 断开';
      updatePresenceUI();
    }
  });
  client.on('reconnect', ()=>{ statusText.textContent='重连中'; });
}

function publishHistory(){
  if(!SYNC_HISTORY || !client || !isConnected) return;
  const topicHist = 'chat/'+myRoomId+'/history';
  const recent = history.slice(-30);
  let imgBudget = 2;
  const data = recent.map(m=>{
    const keepImg = imgBudget>0 && m.images && m.images.length;
    if(keepImg) imgBudget--;
    return {
      id:m.id, sender:m.sender, text:sanitizeLinks(m.text||''),
      images: keepImg ? m.images : [],
      timestamp:m.timestamp, isMe:false
    };
  });
  try{ client.publish(topicHist, JSON.stringify(data), {qos:0, retain:true}); }catch(e){}
}

function send(){
  if(!client || !isConnected){ showToast('连接已断开，正在重连...'); connectToMQTT(); return; }
  let text = inputEl.value.trim();
  if(!text && pending.length===0) return;

  let linkBlocked = false;
  if(text && hasLink(text)){
    text = sanitizeLinks(text);
    linkBlocked = true;
  }

  const imgs = pending.slice();
  pending=[]; renderThumbs();
  inputEl.value=''; autoGrow();

  const msg = {
    id: makeId(), sender: myDisplayName, text: text,
    images: imgs, isMe: true, timestamp: Date.now()
  };
  addMessage(msg);

  const payload = JSON.stringify({
    type:'message', id:msg.id, sender:myDisplayName,
    senderId: MY_CLIENT_ID,
    text: text, images: imgs, timestamp: msg.timestamp
  });
  client.publish('chat/'+myRoomId, payload, {qos:0}, err=>{
    if(err) showToast('发送失败');
    else publishHistory();
  });

  if(linkBlocked) showToast('⚠️ 消息中的链接已自动屏蔽');
}

/* ============ 交互 ============ */
const MAX_TEXTAREA_HEIGHT = 80;
function autoGrow(){
  if(!inputEl) return;
  inputEl.style.height = '36px';
  const scrollH = inputEl.scrollHeight;
  if (scrollH > MAX_TEXTAREA_HEIGHT) {
    inputEl.style.height = MAX_TEXTAREA_HEIGHT + 'px';
    inputEl.style.overflowY = 'auto';
  } else {
    inputEl.style.height = scrollH + 'px';
    inputEl.style.overflowY = 'hidden';
  }
}

inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);
fileInput.addEventListener('change', e=>{ handleFiles(e.target.files); fileInput.value=''; });
pickBtn.addEventListener('click', e=>{ e.stopPropagation(); e.preventDefault(); fileInput.click(); });

clearBtn.addEventListener('click', ()=>{
  showConfirm('确定清空本机聊天记录？', clearHistory);
});

nicknameIn.addEventListener('change', connectToMQTT);
roomIdIn.addEventListener('change', connectToMQTT);
nicknameIn.addEventListener('keydown', e=>{ if(e.key==='Enter') connectToMQTT(); });
roomIdIn.addEventListener('keydown', e=>{ if(e.key==='Enter') connectToMQTT(); });

document.addEventListener('paste', e=>{
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  const files=[];
  for(let i=0;i<items.length;i++){
    if(items[i].kind==='file'){ const f=items[i].getAsFile(); if(f) files.push(f); }
  }
  if(files.length){ e.preventDefault(); handleFiles(files); }
});

['dragenter','dragover'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault()));
document.addEventListener('drop', e=>{
  e.preventDefault();
  if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
});

window.addEventListener('resize', autoGrow);
window.addEventListener('orientationchange', ()=>setTimeout(autoGrow, 200));
window.addEventListener('beforeunload', ()=>{ try{ stopHeartbeat(); }catch(e){} });

window.addEventListener('load', connectToMQTT);
autoGrow();

/* ============ 悬浮按钮逻辑 ============ */
(function(){
  const upBtn   = document.getElementById('upBtn');
  const downBtn = document.getElementById('downBtn');
  if(!upBtn || !downBtn || !messagesEl) return;

  let scrollTimer = null;
  let longPressTimer = null;
  let isLongPress = false;

  function startScroll(dir){
    stopScroll();
    scrollTimer = setInterval(function(){
      const before = messagesEl.scrollTop;
      messagesEl.scrollTop = before + dir * 25;
      if(dir < 0 && messagesEl.scrollTop <= 0) stopScroll();
      if(dir > 0 && messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 1) stopScroll();
    }, 25);
  }
  function stopScroll(){
    if(scrollTimer){ clearInterval(scrollTimer); scrollTimer = null; }
  }

  function bind(btn, dir){
    function down(e){
      e.preventDefault();
      e.stopPropagation();
      isLongPress = false;
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(function(){
        isLongPress = true;
        startScroll(dir);
      }, 320);
    }
    function up(e){
      clearTimeout(longPressTimer);
      if(isLongPress){
        isLongPress = false;
        stopScroll();
      }else{
        messagesEl.scrollTop += dir * messagesEl.clientHeight * 0.85;
      }
    }
    btn.addEventListener('touchstart', down, {passive:false});
    btn.addEventListener('touchend',   up);
    btn.addEventListener('touchcancel',up);
    btn.addEventListener('mousedown',  down);
    btn.addEventListener('mouseup',    up);
    btn.addEventListener('mouseleave', up);
  }

  bind(upBtn,   -1);
  bind(downBtn,  1);
})();
</script>
