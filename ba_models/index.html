<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>屏幕共享</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0f1115;color:#e6e8ee;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:20px;margin:0 0 18px}
  .card{background:#181b22;border:1px solid #262b36;border-radius:12px;padding:18px;margin-bottom:16px}
  .label{font-size:14px;color:#9aa4b6;margin-bottom:10px}
  .link-box{display:flex;gap:8px}
  input{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid #2c3240;
        background:#0f1115;color:#e6e8ee;font-size:13px;outline:none}
  input:focus{border-color:#3b82f6}
  button{padding:10px 16px;border-radius:8px;border:0;background:#3b82f6;color:#fff;
         font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap}
  button:hover{background:#2f6fe0}
  button:disabled{opacity:.5;cursor:not-allowed}
  .big{width:100%;padding:18px;font-size:17px;margin-bottom:8px}
  .danger{background:#ef4444!important}
  .danger:hover{background:#d63b3b!important}
  .status{font-size:13px;color:#9aa4b6;margin-top:12px;line-height:1.6;word-break:break-all}
  .status.warn{color:#f0b429}
  .status.err{color:#ef4444}
  video{width:100%;background:#000;border-radius:10px;aspect-ratio:16/9;display:block;cursor:zoom-in}
  .hidden{display:none!important}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;
       margin-right:6px;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .hint{font-size:15px;line-height:1.7;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">屏幕共享</h1>

  <div id="hostPanel" class="hidden">
    <!-- 新增：信令服务器设置输入框 -->
    <div class="card">
      <div class="label">⚙️ 信令服务器地址（Termux 里 cloudflared 生成的那个链接）：</div>
      <div class="link-box">
        <input id="customServerInput" placeholder="粘贴 https://xxxx.trycloudflare.com">
        <button id="saveServerBtn">保存</button>
      </div>
      <div class="status" id="serverStatus" style="font-size:12px;color:#9aa4b6;margin-top:8px;">
        如果不填，默认使用公共服务器（国内经常连不上）。
      </div>
    </div>

    <div class="card">
      <div class="label">把下面这条链接发给对方，让 TA 用浏览器打开并点击「共享屏幕」：</div>
      <div class="link-box">
        <input id="shareLink" readonly placeholder="正在生成链接…">
        <button id="copyBtn" disabled>复制</button>
      </div>
      <div class="status" id="hostStatus">正在连接服务器…</div>
    </div>
    <div class="card">
      <div class="label">对方屏幕（双击可全屏）：</div>
      <video id="remoteVideo" autoplay playsinline muted></video>
      <div class="status" id="viewStatus">等待对方加入…</div>
    </div>
  </div>

  <div id="guestPanel" class="hidden">
    <div class="card">
      <div class="hint" id="guestHint">
        点击下方按钮，在弹窗里选择要共享的 <strong>屏幕 / 应用窗口 / 浏览器标签页</strong>，
        对方就能实时看到你的屏幕了。共享过程中随时可以点「停止共享」。
      </div>
      <button id="shareBtn" class="big">开始共享我的屏幕</button>
      <button id="stopBtn" class="big danger hidden">停止共享</button>
      <div class="status" id="guestStatus"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var ROOM = new URLSearchParams(location.search).get('room');
  var IS_SHARER = !!ROOM;

  // 从链接或本地存储读取自定义信令服务器地址
  var customHost = new URLSearchParams(location.search).get('host') || localStorage.getItem('peer_host') || '';
  var customPath = new URLSearchParams(location.search).get('path') || localStorage.getItem('peer_path') || '/myapp';
  var customSecure = (new URLSearchParams(location.search).get('secure') || localStorage.getItem('peer_secure') || 'true') === 'true';

  var ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    // 新增免费 TURN 服务器（用于穿透严格网络）
    {
      urls: 'turn:openrelay.metered.ca:80',
      username: 'openrelayproject',
      credential: 'openrelayproject'
    },
    {
      urls: 'turn:openrelay.metered.ca:443',
      username: 'openrelayproject',
      credential: 'openrelayproject'
    },
    {
      urls: 'turn:openrelay.metered.ca:443?transport=tcp',
      username: 'openrelayproject',
      credential: 'openrelayproject'
    }
  ]
};

  var peer = null;
  var peerReady = null;
  var call = null;
  var localStream = null;

  function uid() {
    return 'sc' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // 获取 PeerJS 初始化配置
  function getPeerConfig() {
    if (customHost) {
      return {
        host: customHost.replace(/^https?:\/\//, '').split('/')[0], // 去掉 https:// 和后面的路径
        port: 443,
        path: customPath,
        secure: customSecure,
        debug: 0,
        config: ICE_CONFIG
      };
    }
    return { debug: 0, config: ICE_CONFIG };
  }

  // 生成包含信令服务器信息的分享链接
  function buildShareUrl(id) {
    if (location.protocol === 'file:') {
      return { url: '', warn: '当前是 file:// 打开，对方打不开。' };
    }
    var base = location.origin + location.pathname;
    var url = base + '?room=' + encodeURIComponent(id);
    
    // 如果配置了自定义服务器，把服务器信息也拼到链接里，对方打开就能直接用
    if (customHost) {
      url += '&host=' + encodeURIComponent(customHost) + '&path=' + encodeURIComponent(customPath) + '&secure=' + customSecure;
    }
    
    var warn = '';
    if (location.protocol === 'http:') {
      warn = '当前是 http:// 页面，对方用非本机地址访问时浏览器可能禁止屏幕共享，建议改用 https。';
    }
    return { url: url, warn: warn };
  }

  // 保存自定义信令服务器
  $('saveServerBtn').addEventListener('click', function () {
    var val = $('customServerInput').value.trim();
    if (!val) {
      localStorage.removeItem('peer_host');
      customHost = '';
      $('serverStatus').textContent = '已清除，将使用公共服务器。';
      return;
    }
    // 清理用户输入，只保留 host
    var cleanHost = val.replace(/^https?:\/\//, '').split('/')[0];
    localStorage.setItem('peer_host', cleanHost);
    customHost = cleanHost;
    customPath = '/myapp';
    customSecure = true;
    $('customServerInput').value = cleanHost;
    $('serverStatus').innerHTML = '✅ 已保存：<strong>' + cleanHost + '</strong>。请刷新页面生效。';
    
    // 刷新页面重新初始化
    setTimeout(function(){ location.reload(); }, 1000);
  });

  // 初始化时填充输入框
  if (customHost) {
    $('customServerInput').value = customHost;
    $('serverStatus').innerHTML = '✅ 当前使用：<strong>' + customHost + '</strong>';
  }

  // 复制按钮
  $('copyBtn').addEventListener('click', function () {
    var input = $('shareLink');
    var btn = $('copyBtn');
    var text = (input.value || '').trim();
    var done = function (ok) {
      btn.textContent = ok ? '已复制 ✓' : '复制失败';
      setTimeout(function () { btn.textContent = '复制'; }, 1500);
    };
    if (!text) { done(false); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () {
        input.select(); input.setSelectionRange(0, 99999);
        try { done(document.execCommand('copy')); } catch (e) { done(false); }
      });
    } else {
      input.select(); input.setSelectionRange(0, 99999);
      try { done(document.execCommand('copy')); } catch (e) { done(false); }
    }
  });

  function initHost() {
    $('hostPanel').classList.remove('hidden');
    $('title').textContent = '👀 远程屏幕 · 我是观看方';
    if (typeof Peer === 'undefined') {
      $('hostStatus').textContent = '❌ PeerJS 库加载失败，请检查网络后刷新页面。';
      $('hostStatus').className = 'status err';
      return;
    }
    
    peer = new Peer(uid(), getPeerConfig());
    
    peer.on('open', function (id) {
      var r = buildShareUrl(id);
      if (r.url) {
        $('shareLink').value = r.url;
        $('copyBtn').disabled = false;
        if (r.warn) {
          $('hostStatus').textContent = '⚠️ ' + r.warn;
          $('hostStatus').className = 'status warn';
        } else {
          $('hostStatus').textContent = '✅ 房间已就绪，把链接发给对方吧（请保持本页面打开）';
          $('hostStatus').className = 'status';
        }
      }
    });

    peer.on('call', function (incoming) {
      call = incoming;
      incoming.on('stream', function (stream) {
        var v = $('remoteVideo');
        v.srcObject = stream;
        v.play().catch(function () {});
        $('viewStatus').innerHTML = '<span class="dot"></span>正在接收对方的屏幕…';
        $('viewStatus').className = 'status';
      });
      incoming.on('close', function () {
        $('remoteVideo').srcObject = null;
        $('viewStatus').textContent = '对方已结束共享。';
        $('viewStatus').className = 'status';
      });
      try { incoming.answer(); } catch (e) {}
    });

    peer.on('error', function (err) {
      if (err.type === 'unavailable-id') {
        try { peer.destroy(); } catch (e) {}
        setTimeout(initHost, 400);
        return;
      }
      if (err.type === 'network' || err.type === 'server-error') {
        $('hostStatus').textContent = '⚠️ 信令服务器连接异常，请检查 Termux 服务器是否在运行，或地址是否填对。';
      } else {
        $('hostStatus').textContent = '❌ 出错：' + err.type;
      }
    });

    $('remoteVideo').addEventListener('dblclick', function () {
      var v = $('remoteVideo');
      if (v.requestFullscreen) v.requestFullscreen();
      else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    });
  }

  function initGuest() {
    $('guestPanel').classList.remove('hidden');
    $('title').textContent = '🖥️ 共享我的屏幕';
    if (typeof Peer === 'undefined') {
      $('guestStatus').textContent = '❌ PeerJS 库加载失败，请检查网络后刷新页面。';
      $('guestStatus').className = 'status err';
      return;
    }
    
    peer = new Peer(uid(), getPeerConfig());
    
    peerReady = new Promise(function (resolve, reject) {
      peer.on('open', resolve);
      peer.on('error', reject);
    });
    peerReady.catch(function () {});
    
    peer.on('error', function (err) {
      var msg;
      if (err.type === 'peer-unavailable') {
        msg = '❌ 找不到对方的房间：可能对方已关闭页面，请让 TA 重新发一条新链接。';
      } else if (err.type === 'network' || err.type === 'server-error') {
        msg = '❌ 无法连接信令服务器，请检查 Termux 服务器是否在运行。';
      } else {
        msg = '❌ 出错：' + err.type;
      }
      $('guestStatus').textContent = msg;
      $('guestStatus').className = 'status err';
    });
    
    $('shareBtn').addEventListener('click', startShare);
    $('stopBtn').addEventListener('click', function () { stopShare(); });
  }

  function startShare() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      $('guestStatus').textContent = '❌ 当前环境不支持屏幕共享（需要 https）。';
      $('guestStatus').className = 'status err';
      return;
    }
    $('guestStatus').textContent = '';
    navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 15, max: 30 } },
      audio: false
    }).then(function (stream) {
      localStream = stream;
      $('shareBtn').classList.add('hidden');
      $('stopBtn').classList.remove('hidden');
      $('guestHint').innerHTML = '🔴 <strong>正在共享中</strong>，请不要关闭本页面。';
      $('guestStatus').textContent = '正在连接对方…';
      
      stream.getVideoTracks()[0].addEventListener('ended', function () { stopShare(true); });
      
      return peerReady.then(function () {
        call = peer.call(ROOM, stream);
        if (!call) {
          $('guestStatus').textContent = '❌ 呼叫失败，请刷新页面重试。';
          stopShare(true);
          return;
        }
        $('guestStatus').innerHTML = '<span class="dot"></span>共享中，对方现在应该能看到你的屏幕了。';
        $('guestStatus').className = 'status';
        call.on('close', function () {
          $('guestStatus').textContent = '对方已断开连接。';
        });
      });
    }).catch(function (err) {
      if (err && (err.name === 'NotAllowedError' || err.name === 'AbortError')) {
        $('guestStatus').textContent = '你取消了共享，或未授权屏幕录制权限。';
        $('guestStatus').className = 'status warn';
      } else {
        $('guestStatus').textContent = '❌ 打开屏幕共享失败：' + (err && err.message ? err.message : err);
        $('guestStatus').className = 'status err';
      }
      resetGuestUI();
    });
  }

  function stopShare(fromTrackEnded) {
    if (localStream) {
      localStream.getTracks().forEach(function (t) { t.stop(); });
      localStream = null;
    }
    if (call) {
      try { call.close(); } catch (e) {}
      call = null;
    }
    resetGuestUI();
    $('guestHint').innerHTML = '共享已停止。如需继续，请再次点击下方按钮。';
    $('guestStatus').textContent = '';
    $('guestStatus').className = 'status';
  }

  function resetGuestUI() {
    $('shareBtn').classList.remove('hidden');
    $('stopBtn').classList.add('hidden');
  }

  if (IS_SHARER) {
    initGuest();
  } else {
    initHost();
  }
})();
</script>
</body>
</html>
