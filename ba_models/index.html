<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>屏幕与文件共享</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0f1115;color:#e6e8ee;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:20px;margin:0 0 18px}
  .card{background:#181b22;border:1px solid #262b36;border-radius:12px;padding:18px;margin-bottom:16px}
  .label{font-size:14px;color:#9aa4b6;margin-bottom:10px}
  .link-box{display:flex;gap:8px;margin-bottom:10px}
  input{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid #2c3240;
        background:#0f1115;color:#e6e8ee;font-size:13px;outline:none}
  input:focus{border-color:#3b82f6}
  button{padding:10px 16px;border-radius:8px;border:0;background:#3b82f6;color:#fff;
         font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap}
  button:hover{background:#2f6fe0}
  button:disabled{opacity:.5;cursor:not-allowed}
  .big{width:100%;padding:18px;font-size:17px;margin-bottom:8px}
  .danger{background:#ef4444!important}
  .danger:hover{background:#d63b3b!important}
  .status{font-size:13px;color:#9aa4b6;margin-top:12px;line-height:1.6;word-break:break-all}
  .status.warn{color:#f0b429}
  .status.err{color:#ef4444}
  .status.ok{color:#10b981}
  video{width:100%;background:#000;border-radius:10px;aspect-ratio:16/9;display:block;cursor:zoom-in}
  .hidden{display:none!important}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;
       margin-right:6px;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .hint{font-size:15px;line-height:1.7;margin-bottom:16px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill, minmax(100px,1fr));gap:8px;margin-top:12px;}
  .gallery img{width:100%;height:100px;object-fit:cover;border-radius:6px;border:1px solid #262b36;}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">屏幕与文件共享</h1>

  <div id="hostPanel" class="hidden">
    <div class="card">
      <div class="label">⚙️ 信令服务器地址（Termux 脚本启动后会打印）：</div>
      <div class="link-box">
        <input id="customHostInput" placeholder="粘贴 https://xxxx.trycloudflare.com">
        <button id="saveServerBtn">保存</button>
      </div>
      <div class="status" id="serverStatus" style="font-size:12px;">
        保存后会自动刷新页面。
      </div>
    </div>

    <div class="card">
      <div class="label">把下面这条链接发给对方：</div>
      <div class="link-box">
        <input id="shareLink" readonly placeholder="正在生成链接…">
        <button id="copyBtn" disabled>复制</button>
      </div>
      <div class="status" id="hostStatus">正在连接服务器…</div>
    </div>

    <div class="card">
      <div class="label">对方发来的图片：</div>
      <div class="gallery" id="receivedGallery"></div>
      <div class="status" id="viewStatus">等待对方上传…</div>
    </div>

    <div class="card">
      <div class="label">对方屏幕（双击可全屏）：</div>
      <video id="remoteVideo" autoplay playsinline muted></video>
    </div>
  </div>

  <div id="guestPanel" class="hidden">
    <div class="card">
      <div class="hint" id="guestHint">
        你可以选择共享屏幕，或者直接发送手机里的照片给对方。
      </div>

      <button id="shareBtn" class="big">开始共享我的屏幕</button>
      <button id="stopBtn" class="big danger hidden">停止共享</button>

      <div style="margin-top:20px; border-top:1px solid #262b36; padding-top:20px;">
        <label style="display:block; margin-bottom:10px; font-size:14px;">发送手机相册照片：</label>
        <input type="file" id="fileInput" accept="image/*" multiple style="padding:10px; font-size:13px; background:#0f1115;">
        <button id="uploadBtn" class="big" style="margin-top:10px; background:#10b981;">上传并发送</button>
      </div>

      <div class="status" id="guestStatus"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var ROOM = new URLSearchParams(location.search).get('room');
  var IS_SHARER = !!ROOM;

  // 从 URL 或 localStorage 读取
  var qs = new URLSearchParams(location.search);
  var customHost  = qs.get('host')  || localStorage.getItem('peer_host')  || '';
  var customPath  = qs.get('path')  || localStorage.getItem('peer_path')  || '/myapp';
  var customSecure= (qs.get('secure') || localStorage.getItem('peer_secure') || 'true') === 'true';

  if (qs.get('host')) localStorage.setItem('peer_host', customHost);

  var ICE_CONFIG = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  };

  var peer = null;
  var peerReady = null;
  var call = null;
  var conn = null;
  var localStream = null;

  function uid() {
    return 'sc' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function getPeerConfig() {
    if (customHost) {
      return {
        host: customHost.replace(/^https?:\/\//, '').split('/')[0],
        port: 443,
        path: customPath,
        key: 'peerjs',           // 固定 key，跟服务器端一致
        secure: customSecure,
        debug: 0,
        config: ICE_CONFIG
      };
    }
    return { debug: 0, config: ICE_CONFIG };
  }

  function buildShareUrl(id) {
    if (location.protocol === 'file:') {
      return { url: '', warn: '当前是 file:// 打开，对方打不开。' };
    }
    var base = location.origin + location.pathname;
    var url = base + '?room=' + encodeURIComponent(id);
    if (customHost) {
      url += '&host=' + encodeURIComponent(customHost)
           + '&path=' + encodeURIComponent(customPath)
           + '&secure=' + customSecure;
    }
    var warn = '';
    if (location.protocol === 'http:') {
      warn = '当前是 http:// 页面，浏览器可能禁止屏幕共享。';
    }
    return { url: url, warn: warn };
  }

  $('saveServerBtn').addEventListener('click', function () {
    var h = $('customHostInput').value.trim();
    if (!h) {
      $('serverStatus').textContent = '地址不能为空。';
      $('serverStatus').className = 'status err';
      return;
    }
    var cleanHost = h.replace(/^https?:\/\//, '').split('/')[0];
    localStorage.setItem('peer_host', cleanHost);
    localStorage.setItem('peer_path', '/myapp');
    localStorage.setItem('peer_secure', 'true');
    $('serverStatus').textContent = '✅ 已保存，正在刷新…';
    $('serverStatus').className = 'status ok';
    setTimeout(function(){ location.reload(); }, 800);
  });

  if (customHost) $('customHostInput').value = customHost;

  $('copyBtn').addEventListener('click', function () {
    var input = $('shareLink');
    var btn = $('copyBtn');
    var text = (input.value || '').trim();
    var done = function (ok) {
      btn.textContent = ok ? '已复制 ✓' : '复制失败';
      setTimeout(function () { btn.textContent = '复制'; }, 1500);
    };
    if (!text) { done(false); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () {
        input.select(); input.setSelectionRange(0, 99999);
        try { done(document.execCommand('copy')); } catch (e) { done(false); }
      });
    } else {
      input.select(); input.setSelectionRange(0, 99999);
      try { done(document.execCommand('copy')); } catch (e) { done(false); }
    }
  });

  function initHost() {
    $('hostPanel').classList.remove('hidden');
    $('title').textContent = '👀 远程屏幕与文件 · 我是观看方';

    if (typeof Peer === 'undefined') {
      $('hostStatus').textContent = '❌ PeerJS 库加载失败。';
      $('hostStatus').className = 'status err';
      return;
    }
    if (!customHost) {
      $('hostStatus').textContent = '⚠️ 请先填入 Termux 脚本打印的服务器地址。';
      $('hostStatus').className = 'status warn';
      return;
    }

    peer = new Peer(uid(), getPeerConfig());

    peer.on('open', function (id) {
      var r = buildShareUrl(id);
      if (r.url) {
        $('shareLink').value = r.url;
        $('copyBtn').disabled = false;
        $('hostStatus').textContent = '✅ 房间已就绪，把链接发给对方吧。';
        $('hostStatus').className = 'status ok';
      }
    });

    peer.on('call', function (incoming) {
      call = incoming;
      incoming.on('stream', function (stream) {
        var v = $('remoteVideo');
        v.srcObject = stream;
        v.play().catch(function () {});
        $('viewStatus').innerHTML = '<span class="dot"></span>正在接收对方的屏幕…';
        $('viewStatus').className = 'status';
      });
      incoming.on('close', function () {
        $('remoteVideo').srcObject = null;
        $('viewStatus').textContent = '对方已结束屏幕共享。';
      });
      try { incoming.answer(); } catch (e) {}
    });

    peer.on('connection', function (connection) {
      conn = connection;
      conn.on('data', function (data) {
        if (data && data.type === 'image') {
          var img = document.createElement('img');
          img.src = data.content;
          $('receivedGallery').appendChild(img);
          $('viewStatus').textContent = '已接收新图片。';
          $('viewStatus').className = 'status ok';
        }
      });
    });

    peer.on('error', function (err) {
      if (err.type === 'unavailable-id') {
        try { peer.destroy(); } catch (e) {}
        setTimeout(initHost, 400);
        return;
      }
      if (err.type === 'network' || err.type === 'server-error') {
        $('hostStatus').textContent = '⚠️ 服务器连不上，检查 Termux 是否在运行。';
        $('hostStatus').className = 'status err';
      } else {
        $('hostStatus').textContent = '❌ 出错：' + err.type;
        $('hostStatus').className = 'status err';
      }
    });

    $('remoteVideo').addEventListener('dblclick', function () {
      var v = $('remoteVideo');
      if (v.requestFullscreen) v.requestFullscreen();
      else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    });
  }

  function initGuest() {
    $('guestPanel').classList.remove('hidden');
    $('title').textContent = '🖥️ 共享我的屏幕 / 文件';

    if (typeof Peer === 'undefined') {
      $('guestStatus').textContent = '❌ PeerJS 库加载失败。';
      $('guestStatus').className = 'status err';
      return;
    }

    peer = new Peer(uid(), getPeerConfig());

    peerReady = new Promise(function (resolve, reject) {
      peer.on('open', resolve);
      peer.on('error', reject);
    });
    peerReady.catch(function () {});

    peer.on('error', function (err) {
      var msg;
      if (err.type === 'peer-unavailable') {
        msg = '❌ 找不到对方的房间，可能对方已关闭页面。';
      } else if (err.type === 'network' || err.type === 'server-error') {
        msg = '❌ 无法连接服务器，请确认 Termux 是否在运行。';
      } else {
        msg = '❌ 出错：' + err.type;
      }
      $('guestStatus').textContent = msg;
      $('guestStatus').className = 'status err';
    });

    peerReady.then(function () {
      conn = peer.connect(ROOM);
      conn.on('open', function() {
        $('guestStatus').textContent = '已连接服务器，可以发送图片了。';
        $('guestStatus').className = 'status ok';
      });
    });

    $('shareBtn').addEventListener('click', startShare);
    $('stopBtn').addEventListener('click', function () { stopShare(); });
    $('uploadBtn').addEventListener('click', uploadFiles);
  }

  function uploadFiles() {
    var files = $('fileInput').files;
    if (!files || files.length === 0) {
      $('guestStatus').textContent = '请先选择图片。';
      return;
    }
    if (!conn || !conn.open) {
      $('guestStatus').textContent = '尚未连接对方。';
      return;
    }
    $('guestStatus').textContent = '正在发送 ' + files.length + ' 张图片...';
    Array.from(files).forEach(function(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        conn.send({ type: 'image', name: file.name, content: e.target.result });
      };
      reader.readAsDataURL(file);
    });
    $('guestStatus').textContent = '图片已发送！';
    $('guestStatus').className = 'status ok';
    $('fileInput').value = '';
  }

  function startShare() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      $('guestStatus').textContent = '❌ 当前环境不支持屏幕共享（手机不支持，需用电脑）。';
      $('guestStatus').className = 'status err';
      return;
    }
    navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 15, max: 30 } },
      audio: false
    }).then(function (stream) {
      localStream = stream;
      $('shareBtn').classList.add('hidden');
      $('stopBtn').classList.remove('hidden');
      $('guestHint').innerHTML = '🔴 <strong>正在共享中</strong>。';
      stream.getVideoTracks()[0].addEventListener('ended', function () { stopShare(true); });
      return peerReady.then(function () {
        call = peer.call(ROOM, stream);
        if (!call) { stopShare(true); return; }
        $('guestStatus').innerHTML = '<span class="dot"></span>共享中…';
        $('guestStatus').className = 'status ok';
      });
    }).catch(function (err) {
      if (err && (err.name === 'NotAllowedError' || err.name === 'AbortError')) {
        $('guestStatus').textContent = '你取消了共享。';
      } else {
        $('guestStatus').textContent = '❌ 打开共享失败：' + (err && err.message ? err.message : err);
        $('guestStatus').className = 'status err';
      }
      resetGuestUI();
    });
  }

  function stopShare(fromTrackEnded) {
    if (localStream) {
      localStream.getTracks().forEach(function (t) { t.stop(); });
      localStream = null;
    }
    if (call) { try { call.close(); } catch (e) {} call = null; }
    resetGuestUI();
    $('guestHint').innerHTML = '共享已停止。';
    $('guestStatus').textContent = '';
  }

  function resetGuestUI() {
    $('shareBtn').classList.remove('hidden');
    $('stopBtn').classList.add('hidden');
  }

  if (IS_SHARER) initGuest();
  else initHost();
})();
</script>
</body>
</html>
