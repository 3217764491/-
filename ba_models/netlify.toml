[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "display-capture=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"