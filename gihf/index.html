<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 对话</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --primary:#0b93f6;
    --text:#17181a; --muted:#8b9098; --border:#e3e6ea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;overflow:hidden;
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;background:var(--panel);
    border-bottom:1px solid var(--border);
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .topbar .left{display:flex;flex-direction:column;gap:2px;min-width:0}
  .topbar h1{margin:0;font-size:16px;font-weight:600}
  .topbar .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clear-btn{
    border:1px solid var(--border);background:#fafbfc;color:var(--muted);
    font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer;flex:0 0 auto;
  }
  .clear-btn:hover{background:#f0f2f5;color:#555}

  /* ---------- 消息区 ---------- */
  .messages{
    flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:16px;display:flex;flex-direction:column;gap:14px;
  }
  .msg{display:flex;gap:8px;align-items:flex-start;animation:fadeIn .22s ease}
  .msg.user{flex-direction:row-reverse}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .avatar{
    flex:0 0 34px;width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;font-size:17px;background:#dfe3e8;user-select:none;
  }
  .msg.user .avatar{background:#cfe6ff}

  .bubble{
    max-width:min(78%,560px);
    padding:10px 14px;border-radius:14px;
    background:var(--panel);line-height:1.6;font-size:15px;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
    word-break:break-word;overflow-wrap:anywhere;
    border-top-left-radius:4px;
  }
  .msg.user .bubble{
    background:var(--primary);color:#fff;border-top-left-radius:14px;border-top-right-radius:4px;
  }
  .bubble .text{white-space:pre-wrap}

  /* ---------- 图片 ---------- */
  .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .bubble .text + .imgs{margin-top:8px}
  .img-wrap{
    position:relative;border-radius:10px;overflow:hidden;cursor:pointer;
    line-height:0;background:#f0f2f5;
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .img-wrap img{
    width:140px;height:140px;object-fit:cover;display:block;
    transition:transform .18s ease;
  }
  .img-wrap:hover img{transform:scale(1.04)}
  .img-wrap::after{
    content:"⬇ 点击下载";
    position:absolute;left:0;right:0;bottom:0;
    padding:6px 4px 5px;font-size:11px;line-height:1;color:#fff;text-align:center;
    background:linear-gradient(transparent,rgba(0,0,0,.65));
    opacity:0;transition:opacity .18s ease;pointer-events:none;
  }
  .img-wrap:hover::after{opacity:1}
  @media (hover:none){
    .img-wrap::after{opacity:1}
  }

  /* ---------- 输入中的图片缩略图 ---------- */
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .thumbs:empty{display:none}
  .thumb{position:relative;width:58px;height:58px;border-radius:9px;overflow:hidden;border:1px solid var(--border)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{
    position:absolute;top:2px;right:2px;width:18px;height:18px;padding:0;
    border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
    font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
  }

  /* ---------- 底部输入 ---------- */
  .composer{
    flex:0 0 auto;background:var(--panel);border-top:1px solid var(--border);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .input-row{display:flex;align-items:flex-end;gap:8px}
  .icon-btn{
    flex:0 0 42px;width:42px;height:42px;border-radius:12px;
    background:#f0f2f5;font-size:20px;cursor:pointer;
    display:grid;place-items:center;user-select:none;transition:background .15s;
  }
  .icon-btn:hover{background:#e4e7eb}
  textarea{
    flex:1 1 auto;min-width:0;resize:none;border:1px solid var(--border);
    border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;
    line-height:1.45;max-height:140px;outline:none;
    background:#fafbfc;color:inherit;transition:border-color .15s,background .15s;
  }
  textarea:focus{border-color:var(--primary);background:#fff}
  .send-btn{
    flex:0 0 auto;height:42px;padding:0 18px;border:0;border-radius:12px;
    background:var(--primary);color:#fff;font:inherit;font-size:15px;font-weight:500;
    cursor:pointer;transition:opacity .15s,transform .1s;
  }
  .send-btn:active{transform:scale(.97)}
  .send-btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- 正在输入 ---------- */
  .typing{display:flex;gap:4px;padding:14px 16px}
  .typing i{
    width:7px;height:7px;border-radius:50%;background:#b6bcc4;display:block;
    animation:bounce 1.2s infinite;
  }
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);z-index:999;
    background:rgba(0,0,0,.8);color:#fff;font-size:13px;
    padding:9px 15px;border-radius:10px;max-width:80vw;text-align:center;
    opacity:0;pointer-events:none;transition:.25s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* 滚动条 */
  .messages::-webkit-scrollbar{width:6px}
  .messages::-webkit-scrollbar-thumb{background:#c9cfd6;border-radius:3px}
</style>
</head>
<body>

  <header class="topbar">
    <div class="left">
      <h1>AI 助手</h1>
      <div class="sub" id="statusText">在线</div>
    </div>
    <button class="clear-btn" id="clearBtn">清空对话</button>
  </header>

  <main class="messages" id="messages"></main>

  <footer class="composer">
    <div class="thumbs" id="thumbs"></div>
    <div class="input-row">
      <label class="icon-btn" for="fileInput" title="发送图片">🖼️</label>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>
  </footer>

<script>
/* =========================================================
 *  ① 配置区 —— 以后只需要改这里
 * ========================================================= */
const CONFIG = {
  // 后端接口地址。留空 "" = 本地演示模式（自动回复）
  // 例：API_URL: "https://your-server.com/api/chat"
  API_URL: "",

  // 请求方式：
  //   "json"     —— 图片转成 base64 dataURL，和文字一起塞进 JSON
  //   "formdata" —— 图片作为文件上传（multipart/form-data）
  REQUEST_MODE: "json",

  // json 模式下的字段名
  MSG_FIELD: "message",   // 文字字段
  IMG_FIELD: "images",    // 图片字段（数组）

  // 请求超时（毫秒）
  TIMEOUT: 60000,

  // 额外请求头（需要 token 时写这里，例如 { "Authorization": "Bearer xxx" }）
  HEADERS: {}
};
/* ========================================================= */


/* ---------- 元素引用 ---------- */
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('sendBtn');
const fileInput  = document.getElementById('fileInput');
const thumbsEl   = document.getElementById('thumbs');
const clearBtn   = document.getElementById('clearBtn');
const statusText = document.getElementById('statusText');

/* ---------- 状态 ---------- */
let pending = [];   // 待发送图片 [{src, name}]
let sending = false;

/* ---------- 工具函数 ---------- */
function scrollToBottom(){
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

let toastTimer;
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function dataURLtoBlob(dataUrl){
  const parts = dataUrl.split(',');
  const mime = (parts[0].match(/:(.*?);/) || [,'image/png'])[1];
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}

function guessExt(type){
  const map = {
    'image/jpeg':'.jpg','image/jpg':'.jpg','image/png':'.png',
    'image/gif':'.gif','image/webp':'.webp','image/bmp':'.bmp','image/svg+xml':'.svg'
  };
  return map[type] || '.png';
}

/* =========================================================
 *  ② 点击图片 → 下载
 * ========================================================= */
async function downloadImage(src, name){
  showToast('正在下载…');
  try{
    let blob;
    if(src.startsWith('data:')){
      blob = dataURLtoBlob(src);
    }else{
      const res = await fetch(src, {mode:'cors'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      blob = await res.blob();
    }

    const filename = name && name.trim()
      ? name.trim()
      : ('image_' + Date.now() + guessExt(blob.type));

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);

    showToast('✅ 已开始下载：' + filename);
  }catch(err){
    // 跨域等失败情况：新窗口打开，让用户右键 / 长按保存
    try{ window.open(src, '_blank'); }catch(e){}
    showToast('⚠️ 已在新窗口打开，请长按或右键保存');
  }
}

/* =========================================================
 *  ③ 渲染消息
 * ========================================================= */
function addMessage(role, text, images){
  images = images || [];

  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '🙂' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if(text){
    const t = document.createElement('div');
    t.className = 'text';
    t.textContent = text;
    bubble.appendChild(t);
  }

  if(images.length){
    const box = document.createElement('div');
    box.className = 'imgs';
    images.forEach(function(img){
      const src  = typeof img === 'string' ? img : (img.src || img.url || '');
      const name = (typeof img === 'object' && img.name) ? img.name : '';
      if(!src) return;

      const holder = document.createElement('div');
      holder.className = 'img-wrap';
      holder.title = '点击下载图片';

      const im = document.createElement('img');
      im.src = src;
      im.alt = '图片';
      im.loading = 'lazy';

      holder.appendChild(im);
      holder.addEventListener('click', function(){ downloadImage(src, name); });
      box.appendChild(holder);
    });
    bubble.appendChild(box);
  }

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function addTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.innerHTML =
    '<div class="avatar">🤖</div>' +
    '<div class="bubble typing"><i></i><i></i><i></i></div>';
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

/* =========================================================
 *  ④ 待发送图片缩略图
 * ========================================================= */
function renderThumbs(){
  thumbsEl.innerHTML = '';
  pending.forEach(function(img, idx){
    const d = document.createElement('div');
    d.className = 'thumb';

    const im = document.createElement('img');
    im.src = img.src;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '×';
    btn.title = '移除';
    btn.addEventListener('click', function(){
      pending.splice(idx, 1);
      renderThumbs();
    });

    d.appendChild(im);
    d.appendChild(btn);
    thumbsEl.appendChild(d);
  });
}

function handleFiles(files){
  Array.prototype.slice.call(files).forEach(function(f){
    if(!f || !f.type || f.type.indexOf('image/') !== 0) return;
    if(f.size > 15 * 1024 * 1024){ showToast('图片过大（超过 15MB）'); return; }

    const reader = new FileReader();
    reader.onload = function(){
      pending.push({
        src: reader.result,
        name: f.name || ('image_' + Date.now() + guessExt(f.type))
      });
      renderThumbs();
    };
    reader.readAsDataURL(f);
  });
}

/* =========================================================
 *  ⑤ 网络请求
 * ========================================================= */
async function request(text, imgs){
  if(!CONFIG.API_URL){
    // 演示模式
    return new Promise(function(resolve){
      setTimeout(function(){
        let r = '（演示模式：还没接后端）我收到了你的消息：';
        r += text ? '「' + text + '」' : '（空文本）';
        if(imgs.length) r += '，另外还有 ' + imgs.length + ' 张图片。';
        resolve({ reply: r });
      }, 600);
    });
  }

  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, CONFIG.TIMEOUT);

  let body;
  const headers = Object.assign({}, CONFIG.HEADERS);

  if(CONFIG.REQUEST_MODE === 'formdata'){
    body = new FormData();
    body.append(CONFIG.MSG_FIELD, text);
    imgs.forEach(function(img, i){
      const blob = dataURLtoBlob(img.src);
      body.append(CONFIG.IMG_FIELD, blob, img.name || ('image_' + i + guessExt(blob.type)));
    });
  }else{
    headers['Content-Type'] = 'application/json';
    const payload = {};
    payload[CONFIG.MSG_FIELD] = text;
    payload[CONFIG.IMG_FIELD] = imgs.map(function(i){ return i.src; });
    body = JSON.stringify(payload);
  }

  try{
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: headers,
      body: body,
      signal: ctrl.signal
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);

    const ct = res.headers.get('content-type') || '';
    if(ct.indexOf('application/json') !== -1){
      return await res.json();
    }
    return { reply: await res.text() };
  }finally{
    clearTimeout(timer);
  }
}

/* 兼容各种返回格式：{reply}/{message}/{text}/{content}/{answer}/{output} */
function parseReply(data){
  if(data == null) return { text:'', images:[] };
  if(typeof data === 'string') return { text: data, images: [] };

  const text = data.reply ?? data.message ?? data.text ??
               data.content ?? data.answer ?? data.output ?? '';

  let images = data.images ?? data.image ?? data.imgs ?? data.pics ?? [];
  if(typeof images === 'string') images = [images];
  if(!Array.isArray(images)) images = [];

  images = images.map(function(i){
    if(typeof i === 'string') return { src: i, name: '' };
    return { src: i.url || i.src || i.data || '', name: i.name || i.filename || '' };
  }).filter(function(i){ return i.src; });

  return { text: String(text || ''), images: images };
}

/* =========================================================
 *  ⑥ 发送
 * ========================================================= */
async function send(){
  if(sending) return;

  const text = inputEl.value.trim();
  if(!text && pending.length === 0) return;

  const imgs = pending.slice();
  pending = [];
  renderThumbs();
  inputEl.value = '';
  autoGrow();

  addMessage('user', text, imgs);

  sending = true;
  sendBtn.disabled = true;
  const typingEl = addTyping();

  try{
    const data = await request(text, imgs);
    const parsed = parseReply(data);
    typingEl.remove();
    addMessage('assistant', parsed.text || '（无内容）', parsed.images);
  }catch(err){
    typingEl.remove();
    const msg = (err && err.name === 'AbortError')
      ? '请求超时，请稍后重试。'
      : ('请求失败：' + (err && err.message ? err.message : err));
    addMessage('assistant', '⚠️ ' + msg);
  }finally{
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

/* =========================================================
 *  ⑦ 交互绑定
 * ========================================================= */
function autoGrow(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}

inputEl.addEventListener('input', autoGrow);

inputEl.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', send);

fileInput.addEventListener('change', function(e){
  handleFiles(e.target.files);
  fileInput.value = '';
});

clearBtn.addEventListener('click', function(){
  if(!messagesEl.children.length) return;
  if(confirm('确定清空当前对话吗？')){
    messagesEl.innerHTML = '';
    welcome();
  }
});

/* 粘贴图片 */
document.addEventListener('paste', function(e){
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  const files = [];
  for(let i = 0; i < items.length; i++){
    if(items[i].kind === 'file'){
      const f = items[i].getAsFile();
      if(f) files.push(f);
    }
  }
  if(files.length){
    e.preventDefault();
    handleFiles(files);
    showToast('已添加 ' + files.length + ' 张图片');
  }
});

/* 拖拽图片 */
['dragenter','dragover'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); });
});
document.addEventListener('drop', function(e){
  e.preventDefault();
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
    handleFiles(e.dataTransfer.files);
  }
});

/* 欢迎语 */
function welcome(){
  addMessage('assistant', '你好！我是 AI 助手 👋\n可以打字聊天，也可以点左下角 🖼️ 发送图片。\n发送后，点击对话里的图片即可下载保存。');
}

/* 启动 */
statusText.textContent = CONFIG.API_URL ? '已连接后端' : '演示模式（未配置接口）';
welcome();
autoGrow();
inputEl.focus();
</script>
</body>
</html>
