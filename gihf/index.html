
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P2P 聊天室 (MQTT版)</title>
<script src="https://unpkg.com/mqtt@4.1.0/dist/mqtt.min.js"></script>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --primary:#0b93f6;
    --text:#17181a; --muted:#8b9098; --border:#e3e6ea;
    --ui-scale: 0.65;
  }
  html { zoom: var(--ui-scale); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;
    height: calc(100vh / var(--ui-scale));
    overflow:hidden;
  }
  .join-panel{
    flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .join-panel h1{margin:0;font-size:16px;font-weight:600}
  .join-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .join-row input{
    flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;font:inherit;font-size:14px;outline:none;
    transition:border-color .2s;
  }
  .join-row input:focus{border-color:var(--primary)}
  .status{font-size:12px;color:var(--muted)}
  .status.online{color:#22c55e}
  .clear-btn{
    flex:0 0 auto;padding:7px 12px;border:1px solid var(--border);border-radius:8px;
    background:#f7f8fa;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;
    transition:.15s;
  }
  .clear-btn:hover{background:#ffe9e9;border-color:#ffc9c9;color:#d64545}

  .messages{
    flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:16px;display:flex;flex-direction:column;gap:14px;
  }
  .msg{display:flex;gap:8px;align-items:flex-start;animation:fadeIn .22s ease}
  .msg.me{flex-direction:row-reverse}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .avatar{
    flex:0 0 34px;width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;font-size:16px;background:#dfe3e8;user-select:none;
  }
  .msg.me .avatar{background:#cfe6ff}
  .bubble{
    max-width:min(78%,560px);padding:10px 14px;border-radius:14px;
    background:var(--panel);line-height:1.6;font-size:15px;
    box-shadow:0 1px 2px rgba(0,0,0,.06);word-break:break-word;overflow-wrap:anywhere;
    border-top-left-radius:4px;
  }
  .msg.me .bubble{background:var(--primary);color:#fff;border-top-left-radius:14px;border-top-right-radius:4px}
  .sender{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
  .msg.me .sender{color:#d0e8ff;text-align:right}
  .bubble .text{white-space:pre-wrap}

  .msg-system{display:flex;justify-content:center;margin:6px 0}
  .msg-system span{
    background:#dcdfe3;color:#555;font-size:12px;
    padding:4px 12px;border-radius:12px;
  }

  .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .bubble .text + .imgs{margin-top:8px}
  .img-wrap{
    position:relative;border-radius:10px;overflow:hidden;cursor:pointer;
    line-height:0;background:#f0f2f5;box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .img-wrap img{width:140px;height:140px;object-fit:cover;display:block;transition:transform .18s ease}
  .img-wrap:hover img{transform:scale(1.04)}
  .img-wrap::after{
    content:"⬇ 点击下载";position:absolute;left:0;right:0;bottom:0;
    padding:6px 4px 5px;font-size:11px;line-height:1;color:#fff;text-align:center;
    background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:opacity .18s ease;pointer-events:none;
  }
  .img-wrap:hover::after{opacity:1}
  @media (hover:none){.img-wrap::after{opacity:1}}

  .composer{
    flex:0 0 auto;background:var(--panel);border-top:1px solid var(--border);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .thumbs:empty{display:none}
  .thumb{position:relative;width:58px;height:58px;border-radius:9px;overflow:hidden;border:1px solid var(--border)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{
    position:absolute;top:2px;right:2px;width:18px;height:18px;padding:0;
    border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
    font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
    z-index: 10;
  }
  .input-row{display:flex;align-items:flex-end;gap:8px}
  .icon-btn{
    flex:0 0 42px;width:42px;height:42px;border-radius:12px;
    background:#f0f2f5;font-size:20px;cursor:pointer;display:grid;place-items:center;user-select:none;
  }
  .icon-btn:hover{background:#e4e7eb}
  textarea{
    flex:1 1 auto;min-width:0;resize:none;border:1px solid var(--border);
    border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;
    line-height:1.45;max-height:140px;outline:none;background:#fafbfc;color:inherit;
  }
  textarea:focus{border-color:var(--primary);background:#fff}
  .send-btn{
    flex:0 0 auto;height:42px;padding:0 18px;border:0;border-radius:12px;
    background:var(--primary);color:#fff;font:inherit;font-size:15px;font-weight:500;
    cursor:pointer;transition:opacity .15s,transform .1s;
  }
  .send-btn:active{transform:scale(.97)}
  .send-btn:disabled{opacity:.45;cursor:not-allowed}
  #toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);z-index:999;background:rgba(0,0,0,.8);color:#fff;
    font-size:13px;padding:9px 15px;border-radius:10px;max-width:80vw;text-align:center;
    opacity:0;pointer-events:none;transition:.25s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .messages::-webkit-scrollbar{width:6px}
  .messages::-webkit-scrollbar-thumb{background:#c9cfd6;border-radius:3px}
</style>
</head>
<body>

  <div class="join-panel" id="joinPanel">
    <h1>🌐 P2P 聊天室 (MQTT版)</h1>
    <div class="join-row">
      <input type="text" id="nickname" placeholder="你的昵称" value="用户">
      <input type="text" id="roomId" placeholder="房间号" value="room1">
    </div>
    <div class="join-row">
      <span class="status" id="statusText">正在自动连接...</span>
      <button class="clear-btn" id="clearBtn" type="button" title="只清除本机保存的记录">🗑️ 清空本地记录</button>
    </div>
  </div>

  <main class="messages" id="messages"></main>

  <footer class="composer">
    <div class="thumbs" id="thumbs"></div>
    <div class="input-row">
      <div class="icon-btn" id="pickBtn" title="发送图片">🖼️</div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送…"></textarea>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>
  </footer>

  <div id="toast"></div>

<script>
/* =========================================================
 *  配置
 * ========================================================= */
const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
const MAX_HISTORY  = 200;   // 本地最多保留多少条
const SYNC_HISTORY = true;  // ★ 是否开启"全房间共享历史"（MQTT retained）
const MAX_IMG_SIDE = 1024;  // 图片压缩：最长边
const JPEG_QUALITY = 0.75;  // 图片压缩：质量

let client = null;
let myNickname = '';
let myRoomId = '';
let isConnected = false;
let hasJoined = false;

const messagesEl  = document.getElementById('messages');
const inputEl     = document.getElementById('input');
const sendBtn     = document.getElementById('sendBtn');
const fileInput   = document.getElementById('fileInput');
const thumbsEl    = document.getElementById('thumbs');
const statusText  = document.getElementById('statusText');
const nicknameIn  = document.getElementById('nickname');
const roomIdIn    = document.getElementById('roomId');
const pickBtn     = document.getElementById('pickBtn');
const clearBtn    = document.getElementById('clearBtn');

let pending = [];

/* =========================================================
 *  工具函数
 * ========================================================= */
function scrollToBottom() {
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

function dataURLtoBlob(dataUrl) {
  const parts = dataUrl.split(',');
  const mime = (parts[0].match(/:(.*?);/) || [,'image/png'])[1];
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function guessExt(type) {
  const map = { 'image/jpeg':'.jpg','image/jpg':'.jpg','image/png':'.png','image/gif':'.gif','image/webp':'.webp' };
  return map[type] || '.png';
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* =========================================================
 *  ★ 本地历史记录（localStorage 持久化）
 * ========================================================= */
const seenIds = new Set();
let history = [];
let saveTimer = null;

function historyKey() { return 'chat_history_' + myRoomId; }

function loadHistory() {
  history = [];
  seenIds.clear();
  try {
    const raw = localStorage.getItem(historyKey());
    const arr = raw ? JSON.parse(raw) : [];
    if (Array.isArray(arr)) {
      arr.forEach(m => {
        if (!m || !m.id || seenIds.has(m.id)) return;
        seenIds.add(m.id);
        history.push(m);
      });
    }
  } catch (e) {
    console.warn('读取本地历史失败', e);
    history = [];
  }
}

function saveHistory() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    let arr = history.slice(-MAX_HISTORY);
    while (arr.length) {
      try {
        localStorage.setItem(historyKey(), JSON.stringify(arr));
        return;
      } catch (e) {
        // 多半是超出 5MB 配额：丢掉最旧的四分之一再试
        arr = arr.slice(Math.ceil(arr.length / 4));
      }
    }
    try { localStorage.removeItem(historyKey()); } catch (e) {}
  }, 300);
}

function clearHistory() {
  history = [];
  seenIds.clear();
  try { localStorage.removeItem(historyKey()); } catch (e) {}
  messagesEl.innerHTML = '';
  addSystemMessage('🗑️ 本机聊天记录已清空');
}

/* =========================================================
 *  图片下载
 * ========================================================= */
async function downloadImage(src, name) {
  showToast('正在下载…');
  try {
    let blob;
    if (src.startsWith('data:')) {
      blob = dataURLtoBlob(src);
    } else {
      const res = await fetch(src, { mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      blob = await res.blob();
    }
    const filename = name && name.trim() ? name.trim() : ('image_' + Date.now() + guessExt(blob.type));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    showToast('✅ 已开始下载：' + filename);
  } catch (err) {
    try { window.open(src, '_blank'); } catch (e) {}
    showToast('⚠️ 已在新窗口打开，请长按或右键保存');
  }
}

/* =========================================================
 *  渲染消息
 * ========================================================= */
function renderMessage(m) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (m.isMe ? 'me' : '');
  if (m.id) wrap.dataset.id = m.id;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = m.sender ? m.sender.charAt(0).toUpperCase() : '?';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (m.sender) {
    const s = document.createElement('div');
    s.className = 'sender';
    s.textContent = m.sender;
    bubble.appendChild(s);
  }

  if (m.text) {
    const t = document.createElement('div');
    t.className = 'text';
    t.textContent = m.text;
    bubble.appendChild(t);
  }

  const images = m.images || [];
  if (images.length) {
    const box = document.createElement('div');
    box.className = 'imgs';
    images.forEach(img => {
      const src  = typeof img === 'string' ? img : (img.src || img.url || '');
      const name = (typeof img === 'object' && img.name) ? img.name : '';
      if (!src) return;

      const holder = document.createElement('div');
      holder.className = 'img-wrap';
      holder.title = '点击下载图片';

      const im = document.createElement('img');
      im.src = src; im.alt = '图片'; im.loading = 'lazy';

      holder.appendChild(im);
      holder.addEventListener('click', () => downloadImage(src, name));
      box.appendChild(holder);
    });
    bubble.appendChild(box);
  }

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
}

/** 统一入口：去重 → 入内存 → 渲染 → 落盘 */
function addMessage(msg) {
  if (!msg) return false;
  if (msg.id && seenIds.has(msg.id)) return false;
  if (msg.id) seenIds.add(msg.id);

  history.push(msg);
  if (history.length > MAX_HISTORY * 2) history = history.slice(-MAX_HISTORY);

  renderMessage(msg);
  scrollToBottom();
  saveHistory();
  return true;
}

function renderHistory() {
  messagesEl.innerHTML = '';
  history.forEach(renderMessage);
  scrollToBottom();
}

function addSystemMessage(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-system';
  const span = document.createElement('span');
  span.textContent = text;
  wrap.appendChild(span);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

/* =========================================================
 *  待发送图片缩略图
 * ========================================================= */
function renderThumbs() {
  thumbsEl.innerHTML = '';
  pending.forEach((img, idx) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const im = document.createElement('img');
    im.src = img.src;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = '×'; btn.title = '移除';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      pending.splice(idx, 1);
      renderThumbs();
    });
    d.appendChild(im);
    d.appendChild(btn);
    thumbsEl.appendChild(d);
  });
}

/* ★ 图片压缩：大幅降低 MQTT 报文体积和 localStorage 占用 */
function compressImage(file) {
  return new Promise((resolve) => {
    // GIF 不压缩，避免动图变静图
    if (file.type === 'image/gif') {
      const r = new FileReader();
      r.onload = () => resolve({ src: r.result, name: file.name });
      r.onerror = () => resolve(null);
      r.readAsDataURL(file);
      return;
    }
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, MAX_IMG_SIDE / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let out;
        try { out = cv.toDataURL('image/jpeg', JPEG_QUALITY); }
        catch (e) { out = r.result; }
        resolve({ src: out, name: file.name });
      };
      img.onerror = () => resolve({ src: r.result, name: file.name });
      img.src = r.result;
    };
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}

async function handleFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  for (const f of list) {
    if (!f || !f.type || !f.type.startsWith('image/')) continue;
    if (f.size > 10 * 1024 * 1024) { showToast('图片过大（超过 10MB）'); continue; }
    const out = await compressImage(f);
    if (!out) continue;
    pending.push({
      src: out.src,
      name: f.name || ('image_' + Date.now() + guessExt(f.type))
    });
    renderThumbs();
  }
  if (pending.length) showToast('已添加 ' + pending.length + ' 张图片');
}

/* =========================================================
 *  MQTT 连接与发送
 * ========================================================= */
function connectToMQTT() {
  if (client) {
    try { client.end(true); } catch (e) {}
    client = null;
  }

  myNickname = nicknameIn.value.trim() || '匿名';
  myRoomId   = roomIdIn.value.trim() || 'room1';
  hasJoined  = false;
  isConnected = false;

  /* ★ 进入/切换房间时，先把本机保存的历史读出来渲染 */
  loadHistory();
  renderHistory();

  statusText.textContent = '正在连接 MQTT 服务器...';
  statusText.className = 'status';

  client = mqtt.connect(MQTT_BROKER, {
    clientId: 'web_' + Math.random().toString(16).substr(2, 8),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000,
    keepalive: 60,
  });

  const topic     = 'chat/' + myRoomId;
  const topicHist = 'chat/' + myRoomId + '/history';

  client.on('connect', () => {
    isConnected = true;
    statusText.textContent = '✅ 已连接，正在订阅房间...';
    statusText.className = 'status online';

    const subList = SYNC_HISTORY ? [topic, topicHist] : [topic];
    client.subscribe(subList, (err) => {
      if (!err) {
        statusText.textContent = '✅ 已进入房间：' + myRoomId;
        statusText.className = 'status online';

        if (!hasJoined) {
          hasJoined = true;
          const joinPayload = JSON.stringify({
            type: 'join',
            sender: myNickname,
            senderId: client.options.clientId,
            timestamp: Date.now()
          });
          client.publish(topic, joinPayload, { qos: 0 });
        }

        // ★ 连接后，如果本机历史比云端更全，就把本机历史推上去
        if (SYNC_HISTORY) publishHistory();
      } else {
        statusText.textContent = '❌ 订阅房间失败：' + err.message;
      }
    });
  });

  client.on('message', (recvTopic, payload) => {
    let data;
    try { data = JSON.parse(payload.toString()); }
    catch (e) { console.warn('解析消息失败', e); return; }

    /* ---- 收到"共享历史" ---- */
    if (SYNC_HISTORY && recvTopic === topicHist) {
      if (!Array.isArray(data)) return;
      data.forEach(m => {
        if (!m || !m.id) return;
        addMessage({
          id: m.id,
          sender: m.sender,
          text: m.text,
          images: m.images || [],
          isMe: false,          // 别人同步来的，绝不当成自己发的
          timestamp: m.timestamp
        });
      });
      return;
    }

    /* ---- 忽略自己发的（本地已渲染过） ---- */
    if (data.senderId && data.senderId === client.options.clientId) return;

    if (data.type === 'join') {
      addSystemMessage(`👤 ${data.sender} 加入了房间`);
      return;
    }

    addMessage({
      id: data.id || (String(data.senderId) + '_' + data.timestamp),
      sender: data.sender,
      text: data.text,
      images: data.images || [],
      isMe: false,
      timestamp: data.timestamp
    });
  });

  client.on('error', (err) => {
    statusText.textContent = '❌ 连接失败：' + err.message;
  });

  client.on('close', () => {
    if (isConnected) {
      statusText.textContent = '⚠️ 连接已断开，正在尝试重连...';
      statusText.className = 'status';
    }
  });

  client.on('reconnect', () => {
    statusText.textContent = '正在重新连接...';
    statusText.className = 'status';
  });
}

/* ★ 把本地历史作为 retained 消息发布到 chat/<room>/history */
function publishHistory() {
  if (!SYNC_HISTORY || !client || !isConnected) return;

  const topicHist = 'chat/' + myRoomId + '/history';
  const recent = history.slice(-30);   // 只同步最近 30 条
  let imgBudget = 2;                   // retained 消息有大小限制，最多带 2 张图

  const data = recent.map(m => {
    const keepImg = imgBudget > 0 && m.images && m.images.length;
    if (keepImg) imgBudget--;
    return {
      id: m.id,
      sender: m.sender,
      text: m.text || '',
      images: keepImg ? m.images : [],
      timestamp: m.timestamp,
      isMe: false
    };
  });

  try {
    client.publish(topicHist, JSON.stringify(data), { qos: 0, retain: true });
  } catch (e) {
    console.warn('同步历史失败', e);
  }
}

function send() {
  if (!client || !isConnected) {
    showToast('连接已断开，正在尝试重连...');
    connectToMQTT();
    return;
  }

  const text = inputEl.value.trim();
  if (!text && pending.length === 0) return;

  const imgs = pending.slice();
  pending = []; renderThumbs();
  inputEl.value = ''; autoGrow();

  const msg = {
    id: makeId(),
    sender: myNickname,
    text: text,
    images: imgs,
    isMe: true,
    timestamp: Date.now()
  };

  // 本地立即显示 + 落盘
  addMessage(msg);

  const payload = JSON.stringify({
    type: 'message',
    id: msg.id,
    sender: myNickname,
    senderId: client.options.clientId,
    text: text,
    images: imgs,
    timestamp: msg.timestamp
  });

  const topic = 'chat/' + myRoomId;
  client.publish(topic, payload, { qos: 0 }, (err) => {
    if (err) showToast('发送失败，请检查网络');
    else publishHistory();   // ★ 顺便更新共享历史
  });
}

/* =========================================================
 *  交互绑定
 * ========================================================= */
function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}

inputEl.addEventListener('input', autoGrow);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', send);

fileInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
  fileInput.value = '';
});

pickBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  e.preventDefault();
  fileInput.click();
});

/* 清空本机记录 */
clearBtn.addEventListener('click', () => {
  if (confirm('确定清空本机保存的聊天记录？\n（只影响你这台设备，别人那边不受影响）')) {
    clearHistory();
  }
});

/* 昵称/房间号变化时自动重连 */
nicknameIn.addEventListener('change', connectToMQTT);
roomIdIn.addEventListener('change', connectToMQTT);
nicknameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectToMQTT(); });
roomIdIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectToMQTT(); });

/* 粘贴图片 */
document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const files = [];
  for (let i = 0; i < items.length; i++) {
    if (items[i].kind === 'file') {
      const f = items[i].getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length) { e.preventDefault(); handleFiles(files); }
});

/* 拖拽上传 */
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    handleFiles(e.dataTransfer.files);
  }
});

/* 页面加载后自动加入 */
window.addEventListener('load', () => {
  connectToMQTT();
});

autoGrow();
</script>
</body>
</html>
