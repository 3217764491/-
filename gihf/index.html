<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P2P 聊天室</title>
<!-- 引入 PeerJS 客户端库 -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --primary:#0b93f6;
    --text:#17181a; --muted:#8b9098; --border:#e3e6ea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;overflow:hidden;
  }
  /* 顶部加入房间面板 */
  .join-panel{
    flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .join-panel h1{margin:0;font-size:16px;font-weight:600}
  .join-row{display:flex;gap:8px;flex-wrap:wrap}
  .join-row input{
    flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;font:inherit;font-size:14px;outline:none;
  }
  .join-row input:focus{border-color:var(--primary)}
  .join-row button{
    padding:8px 16px;border:0;border-radius:8px;background:var(--primary);
    color:#fff;font:inherit;font-size:14px;font-weight:500;cursor:pointer;
  }
  .join-row button:disabled{opacity:.5;cursor:not-allowed}
  .status{font-size:12px;color:var(--muted)}
  .status.online{color:#22c55e}

  /* 消息区 */
  .messages{
    flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:16px;display:flex;flex-direction:column;gap:14px;
  }
  .msg{display:flex;gap:8px;align-items:flex-start;animation:fadeIn .22s ease}
  .msg.me{flex-direction:row-reverse}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .avatar{
    flex:0 0 34px;width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;font-size:16px;background:#dfe3e8;user-select:none;
  }
  .msg.me .avatar{background:#cfe6ff}
  .bubble{
    max-width:min(78%,560px);padding:10px 14px;border-radius:14px;
    background:var(--panel);line-height:1.6;font-size:15px;
    box-shadow:0 1px 2px rgba(0,0,0,.06);word-break:break-word;overflow-wrap:anywhere;
    border-top-left-radius:4px;
  }
  .msg.me .bubble{background:var(--primary);color:#fff;border-top-left-radius:14px;border-top-right-radius:4px}
  .sender{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
  .msg.me .sender{color:#d0e8ff;text-align:right}
  .bubble .text{white-space:pre-wrap}

  /* 图片 */
  .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .bubble .text + .imgs{margin-top:8px}
  .img-wrap{
    position:relative;border-radius:10px;overflow:hidden;cursor:pointer;
    line-height:0;background:#f0f2f5;box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .img-wrap img{width:140px;height:140px;object-fit:cover;display:block;transition:transform .18s ease}
  .img-wrap:hover img{transform:scale(1.04)}
  .img-wrap::after{
    content:"⬇ 点击下载";position:absolute;left:0;right:0;bottom:0;
    padding:6px 4px 5px;font-size:11px;line-height:1;color:#fff;text-align:center;
    background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:opacity .18s ease;pointer-events:none;
  }
  .img-wrap:hover::after{opacity:1}
  @media (hover:none){.img-wrap::after{opacity:1}}

  /* 输入区 */
  .composer{
    flex:0 0 auto;background:var(--panel);border-top:1px solid var(--border);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .thumbs:empty{display:none}
  .thumb{position:relative;width:58px;height:58px;border-radius:9px;overflow:hidden;border:1px solid var(--border)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{
    position:absolute;top:2px;right:2px;width:18px;height:18px;padding:0;
    border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
    font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
  }
  .input-row{display:flex;align-items:flex-end;gap:8px}
  .icon-btn{
    flex:0 0 42px;width:42px;height:42px;border-radius:12px;
    background:#f0f2f5;font-size:20px;cursor:pointer;display:grid;place-items:center;user-select:none;
  }
  .icon-btn:hover{background:#e4e7eb}
  textarea{
    flex:1 1 auto;min-width:0;resize:none;border:1px solid var(--border);
    border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;
    line-height:1.45;max-height:140px;outline:none;background:#fafbfc;color:inherit;
  }
  textarea:focus{border-color:var(--primary);background:#fff}
  .send-btn{
    flex:0 0 auto;height:42px;padding:0 18px;border:0;border-radius:12px;
    background:var(--primary);color:#fff;font:inherit;font-size:15px;font-weight:500;
    cursor:pointer;transition:opacity .15s,transform .1s;
  }
  .send-btn:active{transform:scale(.97)}
  .send-btn:disabled{opacity:.45;cursor:not-allowed}
  #toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);z-index:999;background:rgba(0,0,0,.8);color:#fff;
    font-size:13px;padding:9px 15px;border-radius:10px;max-width:80vw;text-align:center;
    opacity:0;pointer-events:none;transition:.25s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .messages::-webkit-scrollbar{width:6px}
  .messages::-webkit-scrollbar-thumb{background:#c9cfd6;border-radius:3px}
</style>
</head>
<body>

  <!-- 顶部：加入房间面板 -->
  <div class="join-panel" id="joinPanel">
    <h1>🌐 P2P 聊天室</h1>
    <div class="join-row">
      <input type="text" id="nickname" placeholder="你的昵称" value="用户">
      <input type="text" id="roomId" placeholder="房间号" value="room1">
      <input type="text" id="serverUrl" placeholder="信令服务器地址（例如 https://xxx.trycloudflare.com）">
      <button id="joinBtn">加入房间</button>
    </div>
    <div class="status" id="statusText">等待加入...</div>
  </div>

  <!-- 消息区 -->
  <main class="messages" id="messages"></main>

  <!-- 输入区 -->
  <footer class="composer">
    <div class="thumbs" id="thumbs"></div>
    <div class="input-row">
      <label class="icon-btn" for="fileInput" title="发送图片">🖼️</label>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送…"></textarea>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>
  </footer>

  <div id="toast"></div>

<script>
/* =========================================================
 *  全局状态
 * ========================================================= */
let peer = null;
let connections = [];       // 所有已建立的 DataConnection
let myNickname = '';
let myRoomId = '';
let isHost = false;         // 是否是第一个进入房间的人
let connected = false;      // 是否已成功连接到信令服务器

const messagesEl  = document.getElementById('messages');
const inputEl     = document.getElementById('input');
const sendBtn     = document.getElementById('sendBtn');
const fileInput   = document.getElementById('fileInput');
const thumbsEl    = document.getElementById('thumbs');
const joinBtn     = document.getElementById('joinBtn');
const statusText  = document.getElementById('statusText');
const nicknameIn  = document.getElementById('nickname');
const roomIdIn    = document.getElementById('roomId');
const serverUrlIn = document.getElementById('serverUrl');

let pending = [];

/* =========================================================
 *  工具函数
 * ========================================================= */
function scrollToBottom() {
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

let toastTimer;
function showToast(msg) {
  let el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

function dataURLtoBlob(dataUrl) {
  const parts = dataUrl.split(',');
  const mime = (parts[0].match(/:(.*?);/) || [,'image/png'])[1];
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function guessExt(type) {
  const map = { 'image/jpeg':'.jpg','image/jpg':'.jpg','image/png':'.png','image/gif':'.gif','image/webp':'.webp' };
  return map[type] || '.png';
}

/* =========================================================
 *  图片下载
 * ========================================================= */
async function downloadImage(src, name) {
  showToast('正在下载…');
  try {
    let blob;
    if (src.startsWith('data:')) {
      blob = dataURLtoBlob(src);
    } else {
      const res = await fetch(src, { mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      blob = await res.blob();
    }
    const filename = name && name.trim() ? name.trim() : ('image_' + Date.now() + guessExt(blob.type));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    showToast('✅ 已开始下载：' + filename);
  } catch (err) {
    try { window.open(src, '_blank'); } catch (e) {}
    showToast('⚠️ 已在新窗口打开，请长按或右键保存');
  }
}

/* =========================================================
 *  渲染消息
 * ========================================================= */
function addMessage(sender, text, images, isMe) {
  images = images || [];
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (isMe ? 'me' : '');

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = sender ? sender.charAt(0).toUpperCase() : '?';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (sender) {
    const s = document.createElement('div');
    s.className = 'sender';
    s.textContent = sender;
    bubble.appendChild(s);
  }

  if (text) {
    const t = document.createElement('div');
    t.className = 'text';
    t.textContent = text;
    bubble.appendChild(t);
  }

  if (images.length) {
    const box = document.createElement('div');
    box.className = 'imgs';
    images.forEach(img => {
      const src = typeof img === 'string' ? img : (img.src || img.url || '');
      const name = (typeof img === 'object' && img.name) ? img.name : '';
      if (!src) return;

      const holder = document.createElement('div');
      holder.className = 'img-wrap';
      holder.title = '点击下载图片';

      const im = document.createElement('img');
      im.src = src; im.alt = '图片'; im.loading = 'lazy';

      holder.appendChild(im);
      holder.addEventListener('click', () => downloadImage(src, name));
      box.appendChild(holder);
    });
    bubble.appendChild(box);
  }

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

/* =========================================================
 *  待发送图片缩略图
 * ========================================================= */
function renderThumbs() {
  thumbsEl.innerHTML = '';
  pending.forEach((img, idx) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const im = document.createElement('img');
    im.src = img.src;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = '×'; btn.title = '移除';
    btn.addEventListener('click', () => { pending.splice(idx, 1); renderThumbs(); });
    d.appendChild(im); d.appendChild(btn);
    thumbsEl.appendChild(d);
  });
}

function handleFiles(files) {
  Array.from(files).forEach(f => {
    if (!f || !f.type || !f.type.startsWith('image/')) return;
    if (f.size > 10 * 1024 * 1024) { showToast('图片过大（超过 10MB）'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      pending.push({ src: reader.result, name: f.name || ('image_' + Date.now() + guessExt(f.type)) });
      renderThumbs();
    };
    reader.readAsDataURL(f);
  });
}

/* =========================================================
 *  发送消息到所有连接
 * ========================================================= */
function broadcast(text, images) {
  const payload = {
    type: 'message',
    sender: myNickname,
    text: text,
    images: images,
    timestamp: Date.now()
  };
  connections.forEach(conn => {
    if (conn.open) {
      try { conn.send(payload); } catch (e) { console.warn('发送失败', e); }
    }
  });
}

function send() {
  if (!connected) { showToast('请先加入房间'); return; }
  const text = inputEl.value.trim();
  if (!text && pending.length === 0) return;

  const imgs = pending.slice();
  pending = []; renderThumbs();
  inputEl.value = ''; autoGrow();

  addMessage(myNickname, text, imgs, true);  // 本地先显示
  broadcast(text, imgs);                     // 广播给其他人
}

/* =========================================================
 *  PeerJS 逻辑
 * ========================================================= */
function connectToServer() {
  if (peer) { peer.destroy(); peer = null; }

  const rawUrl = serverUrlIn.value.trim();
  if (!rawUrl) { showToast('请输入信令服务器地址'); return; }

  // 从 URL 中提取 host
  let host = rawUrl.replace(/^https?:\/\//, '').split('/')[0];
  const path = rawUrl.includes('/myapp') ? '/myapp' : '/myapp';
  const secure = rawUrl.startsWith('https') || true;

  myNickname = nicknameIn.value.trim() || '匿名';
  myRoomId = roomIdIn.value.trim() || 'room1';

  joinBtn.disabled = true;
  statusText.textContent = '正在连接信令服务器...';
  statusText.className = 'status';

  // 先尝试以房间号作为 Peer ID 连接（成为 Host）
  const hostPeer = new Peer(myRoomId, {
    host: host, port: 443, path: path, secure: secure,
    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
  });

  let hostFailed = false;

  hostPeer.on('open', (id) => {
    isHost = true;
    peer = hostPeer;
    connected = true;
    statusText.textContent = '✅ 已创建房间，等待其他人加入... (你是房主)';
    statusText.className = 'status online';
    joinBtn.disabled = false;
    setupPeerEvents(peer);
  });

  hostPeer.on('error', (err) => {
    if (err.type === 'unavailable-id' && !hostFailed) {
      // 房间号已被占用，说明有人是房主了。我们以随机 ID 连接，再连接房主
      hostFailed = true;
      hostPeer.destroy();
      statusText.textContent = '房间已存在，正在作为成员加入...';
      joinAsMember(host, path, secure);
    } else {
      statusText.textContent = '❌ 连接失败：' + err.message;
      joinBtn.disabled = false;
      showToast('连接失败：' + err.message);
    }
  });
}

function joinAsMember(host, path, secure) {
  const randomId = 'user-' + Math.random().toString(36).slice(2, 8);
  const memberPeer = new Peer(randomId, {
    host: host, port: 443, path: path, secure: secure,
    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
  });

  memberPeer.on('open', () => {
    peer = memberPeer;
    connected = true;
    setupPeerEvents(peer);

    // 连接到房主
    const conn = peer.connect(myRoomId, { reliable: true });
    conn.on('open', () => {
      connections.push(conn);
      statusText.textContent = '✅ 已加入房间，可以开始聊天了';
      statusText.className = 'status online';
      joinBtn.disabled = false;
      showToast('已加入房间');
    });
    conn.on('data', (data) => handleIncoming(conn, data));
    conn.on('close', () => {
      connections = connections.filter(c => c !== conn);
      statusText.textContent = '⚠️ 房主已断开，你可能需要重新加入';
    });
  });

  memberPeer.on('error', (err) => {
    statusText.textContent = '❌ 连接失败：' + err.message;
    joinBtn.disabled = false;
  });
}

function setupPeerEvents(p) {
  // 有人连进来
  p.on('connection', (conn) => {
    connections.push(conn);
    conn.on('open', () => {
      showToast('👤 ' + (conn.metadata?.nickname || '有人') + ' 加入了房间');
      statusText.textContent = '✅ 房间人数：' + (connections.length + 1);
    });
    conn.on('data', (data) => handleIncoming(conn, data));
    conn.on('close', () => {
      connections = connections.filter(c => c !== conn);
      statusText.textContent = '✅ 房间人数：' + (connections.length + 1);
    });
  });

  p.on('error', (err) => {
    console.warn('Peer 错误', err);
  });
}

// 处理收到的数据
function handleIncoming(conn, data) {
  if (!data || data.type !== 'message') return;

  const { sender, text, images } = data;
  addMessage(sender, text, images, false);

  // 如果你是房主，把这条消息转发给其他所有人（星型拓扑）
  if (isHost) {
    connections.forEach(c => {
      if (c !== conn && c.open) {
        try { c.send(data); } catch (e) {}
      }
    });
  }
}

/* =========================================================
 *  交互绑定
 * ========================================================= */
function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}

inputEl.addEventListener('input', autoGrow);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', send);

fileInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
  fileInput.value = '';
});

joinBtn.addEventListener('click', connectToServer);

// 粘贴图片
document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const files = [];
  for (let i = 0; i < items.length; i++) {
    if (items[i].kind === 'file') {
      const f = items[i].getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length) { e.preventDefault(); handleFiles(files); showToast('已添加 ' + files.length + ' 张图片'); }
});

// 拖拽图片
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    handleFiles(e.dataTransfer.files);
  }
});

/* 初始化 */
statusText.textContent = '请填写信令服务器地址，点击“加入房间”';
autoGrow();
</script>
</body>
</html>
